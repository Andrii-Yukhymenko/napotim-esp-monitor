name: Firmware checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Check schedules and response handling
        run: |
          bash scripts/test-display-settings.sh
          bash scripts/test-night-mode.sh
          bash scripts/test-poll-schedule.sh
          bash scripts/test-snapshot-reader.sh
          bash scripts/test-update-status.sh
      - name: Build public Ultra firmware
        run: pio run -e ultra
      - name: Check timestamp glyph colors with the real font decoder
        run: python tests/update_glyph_test.py
      - name: Upload firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-ultra
          path: .pio/build/ultra/firmware.bin
          if-no-files-found: error
          retention-days: 30
